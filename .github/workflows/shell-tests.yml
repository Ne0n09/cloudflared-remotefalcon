name: shell-tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.sh'
      - 'VERSION'
      - 'remotefalcon/**'
      - 'tests/**'
      - '.github/workflows/shell-tests.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - '*.sh'
      - 'VERSION'
      - 'remotefalcon/**'
      - 'tests/**'
      - '.github/workflows/shell-tests.yml'
      - '.github/workflows/release.yml'

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell script tests
        run: bash tests/shell_scripts_test.sh
