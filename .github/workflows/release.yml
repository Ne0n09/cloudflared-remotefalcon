name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify version and tests
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          bash tests/shell_scripts_test.sh
          bash tests/extract-release-notes.sh VERSION docs/release-notes.md github-release-notes.md
      - name: Build verified release archive
        run: |
          mapfile -t release_paths < <(awk '$1 != "retired" && $1 !~ /^#/ && NF == 2 { print $2 }' install-manifest.txt)
          for path in "${release_paths[@]}"; do
            test -e "$path" || { echo "Manifest path is missing: $path" >&2; exit 1; }
          done
          tar -czf cloudflared-remotefalcon.tar.gz "${release_paths[@]}"
          sha256sum cloudflared-remotefalcon.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: github-release-notes.md
          files: |
            cloudflared-remotefalcon.tar.gz
            SHA256SUMS
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.x
      - name: Publish versioned documentation
        run: |
          pip install --requirement requirements-docs.txt
          git fetch origin gh-pages --depth=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          docs_version="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$docs_version" latest
          mike set-default --push latest
