name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify version and tests
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          bash tests/shell_scripts_test.sh
      - name: Build verified release archive
        run: |
          mapfile -t release_paths < <(awk '$1 != "retired" && $1 !~ /^#/ && NF == 2 { print $2 }' install-manifest.txt)
          for path in "${release_paths[@]}"; do
            test -e "$path" || { echo "Manifest path is missing: $path" >&2; exit 1; }
          done
          tar -czf cloudflared-remotefalcon.tar.gz "${release_paths[@]}"
          sha256sum cloudflared-remotefalcon.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            cloudflared-remotefalcon.tar.gz
            SHA256SUMS
