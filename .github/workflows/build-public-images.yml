name: build-public-remote-falcon-images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Remote Falcon platform branch, tag, or commit
        required: false
        default: main
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: public-remote-falcon-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORM_REPOSITORY: Remote-Falcon/remote-falcon-platform

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      full_sha: ${{ steps.version.outputs.full_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      commit_date: ${{ steps.version.outputs.commit_date }}
      image_repository: ${{ steps.image-repository.outputs.value }}
    steps:
      - name: Check out Remote Falcon platform
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Resolve immutable platform version
        id: version
        run: |
          set -euo pipefail
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=7 HEAD)
          commit_date=$(git log -1 --format=%cd --date=format:'%Y.%m.%d')
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "commit_date=$commit_date" >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase image repository
        id: image-repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "value=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - plugins-api
          - control-panel
          - viewer
          - external-api
    name: Build ${{ matrix.service }} (linux/amd64)
    steps:
      - name: Check out Remote Falcon platform
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.full_sha }}
          fetch-depth: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push immutable AMD64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-amd64
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repository }}/${{ matrix.service }}:${{ needs.prepare.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.full_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.short_sha }}
            org.opencontainers.image.licenses=GPL-3.0

  promote:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - plugins-api
          - control-panel
          - viewer
          - external-api
    name: Promote ${{ matrix.service }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Promote coordinated release tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repository }}/${{ matrix.service }}
          SHA_TAG: ${{ needs.prepare.outputs.short_sha }}
          DATE_TAG: ${{ needs.prepare.outputs.commit_date }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${DATE_TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${SHA_TAG}"
