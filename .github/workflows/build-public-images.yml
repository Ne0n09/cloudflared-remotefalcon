name: build-public-remote-falcon-images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Remote Falcon platform branch, tag, or commit
        required: false
        default: main
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: public-remote-falcon-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORM_REPOSITORY: Remote-Falcon/remote-falcon-platform

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      full_sha: ${{ steps.version.outputs.full_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      commit_date: ${{ steps.version.outputs.commit_date }}
      image_repository: ${{ steps.image-repository.outputs.value }}
      release_exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Check out Remote Falcon platform
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Resolve immutable platform version
        id: version
        run: |
          set -euo pipefail
          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=7 HEAD)
          commit_date=$(git log -1 --format=%cd --date=format:'%Y.%m.%d')
          {
            echo "full_sha=$full_sha"
            echo "short_sha=$short_sha"
            echo "commit_date=$commit_date"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase image repository
        id: image-repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "value=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'schedule'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check coordinated release
        if: github.event_name == 'schedule'
        id: release
        env:
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.value }}
          TAG: ${{ steps.version.outputs.short_sha }}
        run: |
          set -euo pipefail
          exists=true
          for service in plugins-api control-panel viewer external-api; do
            image="${REGISTRY}/${IMAGE_REPOSITORY}/${service}:${TAG}"
            manifest=$(docker manifest inspect --verbose "$image" 2>/dev/null || true)
            if jq -e '
              [.[].Descriptor.platform? | select(.os == "linux") | .architecture] as $architectures |
              ($architectures | index("amd64") != null) and
              ($architectures | index("arm64") != null)
            ' <<< "$manifest" >/dev/null 2>&1; then
              echo "Multi-platform image already exists: $image"
            else
              echo "Image needs an AMD64 and ARM64 build: $image"
              exists=false
            fi
          done
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - plugins-api
          - control-panel
          - viewer
          - external-api
        architecture:
          - amd64
          - arm64
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        if: github.event_name == 'schedule'
        id: check
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repository }}/${{ matrix.service }}
          TAG: ${{ needs.prepare.outputs.short_sha }}
        run: |
          manifest=$(docker manifest inspect --verbose "${IMAGE}:${TAG}" 2>/dev/null || true)
          if jq -e '
            [.[].Descriptor.platform? | select(.os == "linux") | .architecture] as $architectures |
            ($architectures | index("amd64") != null) and
            ($architectures | index("arm64") != null)
          ' <<< "$manifest" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Multi-platform image ${IMAGE}:${TAG} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE}:${TAG} is missing AMD64 or ARM64"
          fi

      - name: Check out Remote Falcon platform
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.full_sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push immutable architecture image
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.architecture }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repository }}/${{ matrix.service }}:${{ needs.prepare.outputs.short_sha }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.full_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.short_sha }}
            org.opencontainers.image.licenses=GPL-3.0

      - name: Smoke test native architecture image
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repository }}/${{ matrix.service }}:${{ needs.prepare.outputs.short_sha }}-${{ matrix.architecture }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          suffix="${SERVICE}-${ARCHITECTURE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="rf-smoke-${suffix}"
          mongo_container="rf-smoke-mongo-${suffix}"
          app_container="rf-smoke-app-${suffix}"

          cleanup() {
            docker rm -f "$app_container" "$mongo_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$IMAGE"
          image_architecture=$(docker image inspect --format '{{.Architecture}}' "$IMAGE")
          if [[ "$image_architecture" != "$ARCHITECTURE" ]]; then
            echo "Expected $ARCHITECTURE image, received $image_architecture" >&2
            exit 1
          fi

          docker network create "$network" >/dev/null
          docker run -d --name "$mongo_container" --network "$network" --network-alias mongo \
            -e MONGO_INITDB_ROOT_USERNAME=smoke \
            -e MONGO_INITDB_ROOT_PASSWORD=smoke-password \
            mongo:7.0.43 >/dev/null

          mongo_ready=false
          for _ in {1..30}; do
            if docker exec "$mongo_container" mongosh --quiet \
              --username smoke --password smoke-password \
              --authenticationDatabase admin \
              --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)' >/dev/null 2>&1; then
              mongo_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$mongo_ready" != true ]]; then
            docker logs "$mongo_container" >&2
            exit 1
          fi

          mongo_uri='mongodb://smoke:smoke-password@mongo:27017/remote-falcon?authSource=admin'
          docker run -d --name "$app_container" --network "$network" \
            -e MONGO_URI="$mongo_uri" \
            -e QUARKUS_MONGODB_CONNECTION_STRING="$mongo_uri" \
            -e SPRING_DATA_MONGODB_URI="$mongo_uri" \
            -e QUARKUS_OTEL_SDK_DISABLED=true \
            -e SERVER_PORT=8080 \
            -e SEQUENCE_LIMIT=100 \
            -e WEB_URL=https://example.com \
            -e AUTO_VALIDATE_EMAIL=true \
            -e JWT_USER=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e DOMAIN=example.com \
            -e CLIENT_HEADER=x-forwarded-for \
            -e S3_ENDPOINT=http://127.0.0.1:7070 \
            -e S3_ACCESSKEY=smoke-access-key \
            -e S3_SECRETKEY=smoke-secret-key \
            -e IMAGES_S3_BUCKET=remote-falcon-images \
            -e IMAGES_CDN_ENDPOINT=https://example.com/remote-falcon-images \
            -e VIEWER_API_URL=http://viewer:8080 \
            "$IMAGE" >/dev/null

          for _ in {1..20}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$app_container" 2>/dev/null || true)" != true ]]; then
              echo "$SERVICE exited during its $ARCHITECTURE smoke test." >&2
              docker logs "$app_container" >&2
              exit 1
            fi
            sleep 1
          done
          echo "$SERVICE remained running on $ARCHITECTURE with MongoDB available."

  promote:
    needs:
      - prepare
      - build
    if: github.event_name == 'workflow_dispatch' || needs.prepare.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - plugins-api
          - control-panel
          - viewer
          - external-api
    name: Promote ${{ matrix.service }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Promote coordinated release tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repository }}/${{ matrix.service }}
          SHA_TAG: ${{ needs.prepare.outputs.short_sha }}
          DATE_TAG: ${{ needs.prepare.outputs.commit_date }}
        run: |
          set -euo pipefail
          manifest=$(docker manifest inspect --verbose "${IMAGE}:${SHA_TAG}" 2>/dev/null || true)
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]] && jq -e '
            [.[].Descriptor.platform? | select(.os == "linux") | .architecture] as $architectures |
            ($architectures | index("amd64") != null) and
            ($architectures | index("arm64") != null)
          ' <<< "$manifest" >/dev/null 2>&1; then
            sources=("${IMAGE}:${SHA_TAG}")
          else
            sources=("${IMAGE}:${SHA_TAG}-amd64" "${IMAGE}:${SHA_TAG}-arm64")
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:${DATE_TAG}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"
