# VERSION=2026.5.3.1
# Keep this file in the same directory as compose.yaml
# No manual editing of this file should be required.
# ui, control-panel, viewer, plugins-api, external-api, versitygw are the container_names defined in compose.yaml

server {
    listen 80;
    listen [::]:80;
    server_name ${YOUR_DOMAIN}; #DO NOT EDIT. Edit the .env file YOUR_DOMAIN variable instead.

    return 302 https://$server_name$request_uri;
}

server {
    # SSL configuration
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate         /etc/ssl/cert.pem;
    ssl_certificate_key     /etc/ssl/key.pem;

    server_name ${YOUR_DOMAIN}; #DO NOT EDIT. Edit the .env file YOUR_DOMAIN variable instead.

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
      set $upstream_ui http://ui:3000;
      proxy_pass $upstream_ui;
    }
    location /remote-falcon-control-panel {
      set $upstream_cp http://control-panel:8080;
      proxy_pass $upstream_cp;
    }
    location /remote-falcon-viewer {
      set $upstream_viewer http://viewer:8080;
      proxy_pass $upstream_viewer;
    }
    location /remote-falcon-plugins-api/ {
      set $upstream_plugins http://plugins-api:8080;
      rewrite ^/remote-falcon-plugins-api/(.*)$ /$1 break;
      proxy_pass $upstream_plugins;
    }
    location /remote-falcon-external-api/ {
      set $upstream_external http://external-api:8080;
      rewrite ^/remote-falcon-external-api/(.*)$ /$1 break;
      proxy_pass $upstream_external;
    }
    location /${YOUR_IMAGES_S3_BUCKET} {
      proxy_pass   http://versitygw:7070;
    }
}
